<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- AI Homeroom — the class robot, cut from construction paper -->
  <g transform="rotate(-3 64 66)">
    <!-- antenna -->
    <rect x="61.5" y="19" width="5" height="16" rx="2.5" fill="#f5b73a"/>
    <circle cx="64" cy="16" r="7" fill="#e2543a"/>
    <circle cx="61.5" cy="13.5" r="2" fill="#faf7ef" opacity="0.85"/>
    <!-- ears -->
    <rect x="16" y="58" width="10" height="18" rx="4" fill="#f5b73a"/>
    <rect x="102" y="58" width="10" height="18" rx="4" fill="#e88bab"/>
    <!-- head -->
    <rect x="26" y="37" width="79" height="64" rx="13" fill="#283da3"/>
    <rect x="23" y="33" width="79" height="64" rx="13" fill="#faf7ef"/>
    <!-- eyes -->
    <circle cx="46" cy="60" r="7" fill="#2d3154"/>
    <circle cx="79" cy="60" r="7" fill="#2d3154"/>
    <circle cx="48.5" cy="57.5" r="2.2" fill="#faf7ef"/>
    <circle cx="81.5" cy="57.5" r="2.2" fill="#faf7ef"/>
    <!-- cheeks -->
    <circle cx="36" cy="72" r="4" fill="#e88bab" opacity="0.85"/>
    <circle cx="89" cy="72" r="4" fill="#e88bab" opacity="0.85"/>
    <!-- zigzag mouth -->
    <polyline points="48,81 55,86.5 62,81 69,86.5 76,81" fill="none" stroke="#2d3154" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the AI sparkle -->
  <path d="M103 18 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2 Z" fill="#f5b73a"/>
  <path d="M112 40 l1.8 4.4 4.4 1.8 -4.4 1.8 -1.8 4.4 -1.8 -4.4 -4.4 -1.8 4.4 -1.8 Z" fill="#faf7ef" opacity="0.9"/>
</svg>
